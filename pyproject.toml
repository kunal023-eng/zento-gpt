[project]
name = "zento-gpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kunal Kumar Jena", email = "kunaljena115@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "torch>=2.15.0",
]

[project.scripts]
zento-gpt = "zento_gpt:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
